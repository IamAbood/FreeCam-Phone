name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p receiver -p vcam-mf -p vcam-dshow
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart("v")
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=$v" "/DBinDir=$pwd\target\release" installer\freecam-phone.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          V=${GITHUB_REF_NAME#v}
          IFS=. read -r MA MI PA <<< "$V"
          ./gradlew assembleRelease -PversionName=$V -PversionCode=$((MA*10000+MI*100+PA))
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/FreeCamPhone-$V.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x builds are marked pre-release until verified on real hardware.
          PRE=""; [[ "$GITHUB_REF_NAME" == v0.* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FreeCam Phone $GITHUB_REF_NAME" --generate-notes $PRE
